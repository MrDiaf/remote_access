name: server-control-panel

services:
  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: scp-proxy
    depends_on:
      - frontend
      - backend
      - terminal
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:${DASHBOARD_HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: scp-frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: scp-backend
    env_file:
      - .env
    environment:
      CONFIG_DIR: /config
      DATA_DIR: /data
      HOST_MEDIA_ROOTS: /host-media:/host-mnt
      HOST_MEDIA_HOST_ROOTS: ${HOST_MEDIA_PATH:-/run/media}:${HOST_MOUNT_PATH:-/mnt}
      HOST_ROOT: /host-root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      - type: bind
        source: ${HOST_MEDIA_PATH:-/run/media}
        target: /host-media
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: ${HOST_MOUNT_PATH:-/mnt}
        target: /host-mnt
        read_only: true
        bind:
          propagation: rslave
      # Read-only view of the whole host filesystem for the disk usage page.
      - type: bind
        source: /
        target: /host-root
        read_only: true
        bind:
          propagation: rslave
      - backend-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  terminal:
    build:
      context: ./terminal
    container_name: scp-terminal
    environment:
      TERMINAL_SSH_HOST: ${TERMINAL_SSH_HOST:-host.docker.internal}
      TERMINAL_SSH_PORT: ${TERMINAL_SSH_PORT:-22}
      TERMINAL_SSH_USER: ${TERMINAL_SSH_USER:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - terminal-ssh:/home/terminal/.ssh
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: scp-portainer
    ports:
      - "${PORTAINER_BIND:-127.0.0.1}:${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    restart: unless-stopped

  guacamole-db:
    image: postgres:16-alpine
    container_name: scp-guacamole-db
    profiles:
      - remote
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-guacamole_db}"
      POSTGRES_USER: "${POSTGRES_USER:-guacamole_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
    volumes:
      - guacamole-db-data:/var/lib/postgresql/data
      - ./data/guacamole/initdb.sql:/docker-entrypoint-initdb.d/001-initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  guacd:
    image: guacamole/guacd:${GUACAMOLE_VERSION:-1.6.0}
    container_name: scp-guacd
    profiles:
      - remote
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:${GUACAMOLE_VERSION:-1.6.0}
    container_name: scp-guacamole
    profiles:
      - remote
    depends_on:
      guacd:
        condition: service_started
      guacamole-db:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: guacamole-db
      POSTGRESQL_DATABASE: "${POSTGRES_DB:-guacamole_db}"
      POSTGRESQL_USER: "${POSTGRES_USER:-guacamole_user}"
      POSTGRESQL_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
    ports:
      - "${GUACAMOLE_BIND:-127.0.0.1}:${GUACAMOLE_HTTP_PORT:-8081}:8080"
    restart: unless-stopped

volumes:
  backend-data:
  terminal-ssh:
  caddy-data:
  caddy-config:
  portainer-data:
  guacamole-db-data:
